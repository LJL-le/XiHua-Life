<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的免单资格</title><link rel="stylesheet" href="./css/element.css"><link rel="stylesheet" href="./css/main.css"><link rel="stylesheet" href="./css/theme.css"><style>body{background:#f5f6f8}.record{margin:12px;padding:16px;background:#fff;border-radius:10px}.title{font-size:16px;font-weight:600}.meta{margin-top:8px;color:#888;font-size:13px}.status{float:right;color:#5267f7}.empty{padding:80px 0;text-align:center;color:#999}</style></head><body><div id="app"><div class="header"><div class="header-back-btn" @click="goBack"><i class="el-icon-arrow-left"></i></div><div class="header-title">我的免单资格</div></div><div v-if="!records.length&&!loading" class="empty">暂无免单资格</div><div class="record" v-for="r in records" :key="r.id" @click="toShop(r.shopId)"><span class="status">{{r.statusName||statusText(r)}}</span><div class="title">{{r.activityTitle||'免单资格活动'}}</div><div class="meta">记录号：{{r.id}}</div><div class="meta">领取时间：{{formatTime(r.createTime)}}</div><div class="meta" v-if="r.redeemCode">核销码：{{r.redeemCode}}</div></div></div><script src="./js/vue.js"></script><script src="./js/axios.min.js"></script><script src="./js/element.js"></script><script src="./js/common.js"></script><script>new Vue({el:'#app',data:{records:[],loading:true},created(){this.load()},methods:{load(){axios.get('/free-qualification/records/me').then(({data})=>this.records=data||[]).catch(e=>this.$message.error(e)).finally(()=>this.loading=false)},goBack(){history.back()},toShop(id){if(id)location.href='/shop-detail.html?id='+id},formatTime(v){return v?new Date(v).toLocaleString():'-'},statusText(r){return ['UNUSED','USED','EXPIRED','CANCELLED'][r.status]||'UNKNOWN'}}})</script></body></html>
