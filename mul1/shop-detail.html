<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商铺详情｜西华生活</title><link rel="stylesheet" href="./css/element.css"><link rel="stylesheet" href="./css/main.css"><link rel="stylesheet" href="./css/theme.css"><style>body{background:#f5f6f8}.section{background:#fff;margin-bottom:10px;padding:16px}.hero{width:100%;max-height:260px;object-fit:cover}.title{font-size:22px;font-weight:700}.muted{color:#909399}.activity{border:1px solid #f0c36d;background:#fff9ed;padding:12px;border-radius:8px;margin:8px 0}.review{border-top:1px solid #eee;padding:14px 0}.review img{width:42px;height:42px;border-radius:50%;vertical-align:middle}.form>*{margin:6px 0}.row{display:flex;gap:8px;align-items:center}</style></head><body><div id="app"><div class="header"><div class="header-back-btn" @click="goBack"><i class="el-icon-arrow-left"></i></div><div class="header-title">商铺详情</div></div><div class="section"><img class="hero" v-if="images.length" :src="images[0]"><div class="title">{{shop.name}}</div><el-rate disabled :value="(shop.score||0)/10" show-score></el-rate><p>{{shop.address}} · {{shop.openHours}}</p></div><div class="section"><h3>免单资格</h3><div class="muted" v-if="!activities.length">暂无进行中的活动</div><div class="activity" v-for="a in activities" :key="a.id"><b>{{a.title}}</b><p>{{a.subTitle}} · 剩余 {{a.remainingQuota}} 份</p><p class="muted">{{a.rules}}</p><el-button type="warning" size="small" :disabled="busy||notAvailable(a)" @click="claim(a)">抢免单资格</el-button></div></div><div class="section"><h3>网友评价（{{total}}）</h3><div class="form" v-if="loggedIn"><el-rate v-model="form.score"></el-rate><div class="row"><span>口味</span><el-rate v-model="form.tasteScore"></el-rate></div><div class="row"><span>环境</span><el-rate v-model="form.environmentScore"></el-rate></div><div class="row"><span>服务</span><el-rate v-model="form.serviceScore"></el-rate></div><el-input type="textarea" maxlength="1000" show-word-limit v-model="form.content" placeholder="分享你的真实体验"></el-input><el-button type="primary" :loading="submitting" @click="submitReview">发布评价</el-button></div><div class="review" v-for="r in reviews" :key="r.id"><img :src="r.userIcon||'/imgs/icons/default-icon.png'"> <b>{{r.userName||'用户'}}</b><el-rate disabled :value="r.score"></el-rate><p>{{r.content}}</p><span class="muted">{{r.createTime}}</span></div><el-button v-if="reviews.length<total" @click="loadReviews">加载更多</el-button></div></div><script src="./js/vue.js"></script><script src="./js/axios.min.js"></script><script src="./js/element.js"></script><script src="./js/common.js"></script><script>new Vue({el:'#app',data:{shop:{},activities:[],reviews:[],total:0,current:0,busy:false,submitting:false,form:{score:5,tasteScore:5,environmentScore:5,serviceScore:5,content:''}},computed:{images(){return this.shop.images?this.shop.images.split(','):[]},loggedIn(){return !!sessionStorage.getItem('token')}},created(){this.shopId=util.getUrlParam('id');this.load();this.loadReviews()},methods:{goBack(){history.back()},load(){axios.get('/shop/'+this.shopId).then(({data})=>this.shop=data);axios.get('/free-qualification/activities/shop/'+this.shopId).then(({data})=>this.activities=data||[])},notAvailable(a){let now=Date.now();return a.remainingQuota<1||new Date(a.beginTime)>now||new Date(a.endTime)<now},claim(a){if(!this.loggedIn){location.href='/login.html';return}this.busy=true;axios.post('/free-qualification/activities/'+a.id+'/claim').then(({data})=>{this.$message.success('领取成功，记录号：'+data);a.remainingQuota=Math.max(0,a.remainingQuota-1)}).catch(e=>this.$message.error(e)).finally(()=>this.busy=false)},loadReviews(){axios.get('/shop-reviews',{params:{shopId:this.shopId,current:++this.current,size:10}}).then(({data})=>{this.reviews=this.reviews.concat(data.records);this.total=data.total})},submitReview(){this.submitting=true;axios.post('/shop-reviews',Object.assign({shopId:Number(this.shopId)},this.form)).then(()=>{this.$message.success('评价发布成功');this.reviews=[];this.current=0;this.loadReviews();this.load()}).catch(e=>this.$message.error(e)).finally(()=>this.submitting=false)}}})</script></body></html>
