<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>消息中心｜西华生活</title><link rel="stylesheet" href="./css/element.css"><link rel="stylesheet" href="./css/main.css"><link rel="stylesheet" href="./css/theme.css"><style>.page{padding:14px;background:#f5f7fb;min-height:85vh}.toolbar{display:flex;justify-content:space-between}.item{background:#fff;margin:10px 0;padding:14px;border-radius:10px}.unread{border-left:4px solid #5267f7}.meta{color:#909399;font-size:12px;margin-top:8px}.empty{text-align:center;color:#909399;padding:60px}</style></head><body><div id="app"><div class="header"><div class="header-back-btn" @click="goBack"><i class="el-icon-arrow-left"></i></div><div class="header-title">消息中心</div></div><div class="page"><div class="toolbar"><span>未读 {{unread}}</span><el-button size="mini" @click="readAll" :disabled="!unread">全部已读</el-button></div><div class="empty" v-if="!loading&&!messages.length">暂无消息</div><div class="item" :class="{unread:!m.isRead}" v-for="m in messages" :key="m.id" @click="open(m)"><b>{{labels[m.type]||m.type}}</b><div>{{m.content}}</div><div class="meta">{{m.createTime}}</div></div><el-button v-if="messages.length<total" style="width:100%" @click="load">加载更多</el-button></div><foot-bar :active-btn="3"></foot-bar></div><script src="./js/vue.js"></script><script src="./js/axios.min.js"></script><script src="./js/element.js"></script><script src="./js/common.js"></script><script src="./js/footer.js"></script><script>new Vue({el:'#app',data:{messages:[],current:0,total:0,unread:0,loading:false,labels:{COMMENT:'评论',LIKE:'点赞',FOLLOW:'关注',QUALIFICATION:'免单资格',SYSTEM:'系统通知'}},created(){this.load();this.count()},methods:{goBack(){history.back()},count(){axios.get('/messages/unread-count').then(({data})=>this.unread=data)},load(){if(this.loading)return;this.loading=true;axios.get('/messages',{params:{current:++this.current,size:10}}).then(({data})=>{this.messages=this.messages.concat(data.records);this.total=data.total}).catch(e=>this.$message.error(e)).finally(()=>this.loading=false)},readAll(){axios.put('/messages/read-all').then(()=>{this.messages.forEach(m=>m.isRead=true);this.unread=0})},open(m){if(!m.isRead)axios.put('/messages/'+m.id+'/read').then(()=>{m.isRead=true;this.unread=Math.max(0,this.unread-1)});if(m.targetType==='BLOG')location.href='/blog-detail.html?id='+m.targetId;else if(m.targetType==='USER')location.href='/other-info.html?id='+m.targetId;else if(m.targetType==='QUALIFICATION')location.href='/qualification-records.html'}}})</script></body></html>
